name: Build Clash Party

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Platforms to build
        type: choice
        options: [all, windows, windows7, linux, macos, macos10]
        default: all
      macos_signing:
        description: macOS application and installer signing
        type: choice
        options: [unsigned, signed]
        default: unsigned

permissions:
  contents: read

concurrency:
  group: clash-party-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
  HOMEBREW_NO_ANALYTICS: '1'
  MACOS_SIGNING: ${{ inputs.macos_signing || 'unsigned' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Require matching privacy customization
        env:
          CLASH_PARTY_CUSTOMIZE_SCRIPT: ${{ secrets.CLASH_PARTY_CUSTOMIZE_SCRIPT }}
        run: bash scripts/apply-patch.sh --check-secret
      - id: targets
        env:
          BUILD_TARGET: ${{ inputs.target || 'all' }}
        run: python scripts/matrix.py "$BUILD_TARGET" >> "$GITHUB_OUTPUT"

  checks:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - run: python scripts/checkout-source.py
      - name: Apply privacy patch
        env:
          CLASH_PARTY_CUSTOMIZE_SCRIPT: ${{ secrets.CLASH_PARTY_CUSTOMIZE_SCRIPT }}
        run: bash scripts/apply-patch.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: '11.8.0'
          run_install: false
          cache: true
          cache_dependency_path: source/pnpm-lock.yaml
      - working-directory: source
        run: pnpm install --ignore-scripts --frozen-lockfile
      - working-directory: source
        run: pnpm run format:check && pnpm run lint:check && pnpm run typecheck
      - working-directory: source
        run: pnpm test --maxWorkers=2
      - run: node --experimental-vm-modules scripts/privacy-test.mjs source
      - name: Verify privacy source and original dependencies
        env:
          CLASH_PARTY_CUSTOMIZE_SCRIPT: ${{ secrets.CLASH_PARTY_CUSTOMIZE_SCRIPT }}
        run: bash scripts/apply-patch.sh --verify

  build:
    name: Build ${{ matrix.id }}
    permissions:
      contents: write
    needs: [prepare, checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      npm_config_arch: ${{ matrix.arch }}
      npm_config_target_arch: ${{ matrix.arch }}
      LEGACY_BUILD: ${{ matrix.platform == 'windows7' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - if: startsWith(matrix.platform, 'windows')
        run: git config --global core.longpaths true
      - run: python scripts/checkout-source.py
      - name: Apply privacy patch before dependency scripts
        env:
          CLASH_PARTY_CUSTOMIZE_SCRIPT: ${{ secrets.CLASH_PARTY_CUSTOMIZE_SCRIPT }}
        run: bash scripts/apply-patch.sh
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: '11.8.0'
          run_install: false
          cache: true
          cache_dependency_path: source/pnpm-lock.yaml
      - name: Apply reviewed compatibility variant and lock its inputs
        run: python scripts/variant.py "${{ matrix.platform }}" "${{ matrix.arch }}"
      - name: Install dependencies and upstream lifecycle scripts
        working-directory: source
        run: pnpm install --frozen-lockfile
      - name: Install Linux build tools
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools
      - name: Prepare matching sidecars
        working-directory: source
        env:
          LEGACY_BUILD: ${{ matrix.platform == 'windows7' && 'true' || 'false' }}
        run: pnpm prepare --${{ matrix.arch }}
      - name: Verify source before packaging
        run: python scripts/variant.py --verify
      - name: Import macOS application and installer certificates
        if: startsWith(matrix.platform, 'macos') && env.MACOS_SIGNING == 'signed'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_INSTALLER_LINK: ${{ secrets.CSC_INSTALLER_LINK }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ secrets.CSC_INSTALLER_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/sign-macos.sh import
      - name: Build Windows packages
        if: startsWith(matrix.platform, 'windows')
        working-directory: source
        env:
          LEGACY_BUILD: ${{ matrix.platform == 'windows7' && 'true' || 'false' }}
        run: pnpm build:win --${{ matrix.arch }}
      - name: Add upstream portable flag
        if: startsWith(matrix.platform, 'windows')
        working-directory: source
        shell: pwsh
        run: |
          New-Item -Path "PORTABLE" -ItemType File
          Get-ChildItem dist/*portable.7z | ForEach-Object {
            7z a $_.FullName PORTABLE
          }
      - name: Build Linux packages
        if: matrix.platform == 'linux'
        working-directory: source
        run: pnpm build:linux --${{ matrix.arch }}
      - name: Build macOS packages
        if: startsWith(matrix.platform, 'macos')
        working-directory: source
        run: |
          chmod +x build/pkg-scripts/postinstall build/pkg-scripts/preinstall
          pnpm build:mac --${{ matrix.arch }}
      - name: Sign, notarize and staple macOS installer
        if: startsWith(matrix.platform, 'macos') && env.MACOS_SIGNING == 'signed'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: bash scripts/sign-macos.sh sign
      - name: Verify all tracked source and dependency hashes after packaging
        run: python scripts/variant.py --verify
      - name: Collect complete packages, legacy names and provenance
        run: python scripts/package.py
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: clash-party-${{ matrix.id }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - name: Publish verified target to Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PACKAGE_ID: ${{ matrix.platform }}-${{ matrix.arch }}
        run: python scripts/publish-release.py "$PACKAGE_ID"
      - name: Remove temporary signing keychain
        if: always() && startsWith(matrix.platform, 'macos') && env.MACOS_SIGNING == 'signed'
        run: bash scripts/sign-macos.sh cleanup
